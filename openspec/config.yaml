schema: spec-driven

context: |
  Project: Personal Finance Multi-Agent System.
  Domain: Taiwan-equity research assistant. MVP is scoped to Phison Electronics (8299) and the question of whether the AI SSD growth story supports current valuation.
  Tech stack: Python Flask backend, Vue frontend, local Markdown/JSON fixtures, deterministic agents.
  Runtime boundary: Do not require Supabase, real LLM providers, crawlers, live market data APIs, StatementDog login, or paid data for the MVP.

  Documentation ground truth:
  - README.md is the project entrypoint and quick-start map.
  - AGENTS.md is the development-agent rulebook.
  - docs/README.md is the documentation map and explains folder ownership.
  - SPEC.md is the product and MVP behavior source of truth.
  - openspec/changes/personal-finance-multi-agent-system/ contains the active change proposal, design, tasks, and requirement scenarios.
  - docs/project-proposal.md is the course/demo proposal; it is intentionally separate from OpenSpec proposal.md.
  - docs/course-final-project.md is the canonical AIASE final-project requirement summary.
  - docs/architecture.md, docs/api.md, and docs/technical-report.md are stable engineering/course deliverables.
  - data/ contains runtime fixtures and curated source excerpts, not general docs.
  - knowledge/ contains the Evidence Pack, provenance, and contradiction log. Treat it as the auditable evidence layer for investment claims.

  Evidence and safety rules:
  - Raw sources are immutable inputs; do not silently rewrite source excerpts.
  - Important investment claims must trace to source IDs, provenance, or explicit missing-data gaps.
  - CMoney/news/FactSet/company-official sources must keep their reliability limits.
  - Do not turn research support into buy/sell advice.
  - Missing, paywalled, login-gated, or unverified data must be marked unknown/not_available rather than fabricated.

rules:
  proposal:
    - Keep OpenSpec proposals about change intent, capabilities, and impact.
    - Do not duplicate course/demo proposal content from docs/project-proposal.md unless it changes product scope.
  design:
    - Reference SPEC.md for product scope and docs/README.md for file ownership.
    - Keep API, agent workflow, fixtures, and Evidence Pack contracts explicit.
  tasks:
    - Keep tasks verifiable with local backend tests, OpenSpec validation, frontend build, or documented manual checks.
    - When a task changes a stable doc, name the exact doc path that must be updated.
